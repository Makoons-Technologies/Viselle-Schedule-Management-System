    <script>
      (function () {
        var path = location.pathname || '';
        var host = (location.hostname || '').toLowerCase();
        var bookingPath = path === '/book' || path.indexOf('/book/') === 0;
        var bookingHost = false;
        if (host.length > 'viselle.net'.length + 1 && host.slice(-12) === '.viselle.net') {
          var label = host.slice(0, -12);
          var reserved = {
            www: 1, api: 1, 'staging-api': 1, app: 1, admin: 1, dashboard: 1, sites: 1,
            static: 1, assets: 1, cdn: 1, mail: 1, status: 1, support: 1, help: 1, docs: 1,
            blog: 1, login: 1, signup: 1, auth: 1, billing: 1, owner: 1, platform: 1,
            viselle: 1, makoons: 1, book: 1, booking: 1, manage: 1, public: 1, test: 1,
            staging: 1, prod: 1, production: 1, dev: 1, demo: 1
          };
          bookingHost = !!label && label.indexOf('.') === -1 && !reserved[label];
        }
        if (bookingPath || bookingHost) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          return;
        }
        var key = 'viselle-color-mode';
        var stored = localStorage.getItem(key);
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <script>
      (function () {
        var KEYBOARD_THRESHOLD = 80;
        var SETTLE_DELAYS = [50, 150, 350, 700];
        var KEYBOARD_CLOSE_DELAYS = [80, 200, 400, 600];
        var keyboardWasOpen = false;

        function isKeyboardOpen() {
          var vv = window.visualViewport;
          return !!(vv && window.innerHeight - vv.height > KEYBOARD_THRESHOLD);
        }

        function measureAppHeight() {
          var vv = window.visualViewport;
          var h = window.innerHeight;
          if (vv) h = Math.max(h, Math.round(vv.height + vv.offsetTop));
          return h;
        }

        function resetWindowScroll() {
          if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
          if (document.documentElement.scrollTop) document.documentElement.scrollTop = 0;
          if (document.body.scrollTop) document.body.scrollTop = 0;
        }

        function scheduleSettle(delays) {
          for (var i = 0; i < delays.length; i++) {
            window.setTimeout(onViewportSettle, delays[i]);
          }
        }

        function onViewportSettle() {
          if (isKeyboardOpen()) {
            keyboardWasOpen = true;
            return;
          }
          if (keyboardWasOpen) {
            keyboardWasOpen = false;
            scheduleSettle(KEYBOARD_CLOSE_DELAYS);
          }
          resetWindowScroll();
          document.documentElement.style.setProperty('--app-height', measureAppHeight() + 'px');
        }

        function onFocusOut(event) {
          var target = event.target;
          if (!target || !target.matches) return;
          if (!target.matches('input, textarea, select, [contenteditable="true"]')) return;
          scheduleSettle(KEYBOARD_CLOSE_DELAYS);
        }

        onViewportSettle();
        requestAnimationFrame(onViewportSettle);
        scheduleSettle(SETTLE_DELAYS);
        window.addEventListener('resize', onViewportSettle);
        window.addEventListener('orientationchange', onViewportSettle);
        window.addEventListener('pageshow', onViewportSettle);
        window.addEventListener('focusout', onFocusOut);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', onViewportSettle);
          window.visualViewport.addEventListener('scroll', onViewportSettle);
        }
      })();
    </script>
