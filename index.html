    <script>
      (function () {
        var path = location.pathname || '';
        var host = (location.hostname || '').toLowerCase();
        var bookingPath = path === '/book' || path.indexOf('/book/') === 0;
        var bookingHost = false;
        if (host.length > 'viselle.net'.length + 1 && host.slice(-12) === '.viselle.net') {
          var label = host.slice(0, -12);
          var reserved = {
            www: 1, api: 1, 'staging-api': 1, app: 1, admin: 1, dashboard: 1, sites: 1,
            static: 1, assets: 1, cdn: 1, mail: 1, status: 1, support: 1, help: 1, docs: 1,
            blog: 1, login: 1, signup: 1, auth: 1, billing: 1, owner: 1, platform: 1,
            viselle: 1, makoons: 1, book: 1, booking: 1, manage: 1, public: 1, test: 1,
            staging: 1, prod: 1, production: 1, dev: 1, demo: 1
          };
          bookingHost = !!label && label.indexOf('.') === -1 && !reserved[label];
        }
        if (bookingPath || bookingHost) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          return;
        }
        var key = 'viselle-color-mode';
        var stored = localStorage.getItem(key);
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <script>
      (function () {
        var KEYBOARD_THRESHOLD = 80;
        var SETTLE_DELAYS = [50, 150, 350, 700];
        var KEYBOARD_CLOSE_DELAYS = [80, 200, 400, 600];
        var keyboardWasOpen = false;

        function isStandaloneWebApp() {
          return !!(
            navigator.standalone ||
            window.matchMedia('(display-mode: standalone)').matches
          );
        }

        if (isStandaloneWebApp()) {
          document.documentElement.classList.add('standalone-pwa');
        }

        // Logged-in PWA launch: paint a white/dark theme-color before React.
        // Maroon `#2a0f1e` + viewport-fit=cover is the frosted band over the title.
        function applyLoggedInShellThemeColor() {
          var host = (location.hostname || '').toLowerCase();
          var path = location.pathname || '';
          var bookingPath = path === '/book' || path.indexOf('/book/') === 0;
          var bookingHost = false;
          if (host.length > 'viselle.net'.length + 1 && host.slice(-12) === '.viselle.net') {
            var label = host.slice(0, -12);
            bookingHost = !!label && label.indexOf('.') === -1;
          }
          if (bookingPath || bookingHost) return;
          var token = null;
          try { token = localStorage.getItem('viselle_auth_token'); } catch (e) {}
          if (!token) return;
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (!themeMeta) return;
          var dark = document.documentElement.classList.contains('dark');
          themeMeta.setAttribute('content', dark ? '#1c1917' : '#ffffff');
        }
        applyLoggedInShellThemeColor();

        function isIosStandaloneWebApp() {
          if (!isStandaloneWebApp()) return false;
          var ua = navigator.userAgent || '';
          var iPadOs = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
          return /iPhone|iPad|iPod/i.test(ua) || iPadOs;
        }

        function isKeyboardOpen() {
          var vv = window.visualViewport;
          return !!(vv && window.innerHeight - vv.height > KEYBOARD_THRESHOLD);
        }

        function measureBrowserAppHeight() {
          var vv = window.visualViewport;
          var h = window.innerHeight;
          if (vv) h = Math.max(h, Math.round(vv.height + vv.offsetTop));
          return h;
        }

        // Layout viewport (webview). Do not use 100vh — that is the SCREEN and
        // overflows by the opaque status bar on iOS standalone (BEA-83).
        function measureLayoutViewportHeight() {
          var client = (document.documentElement && document.documentElement.clientHeight) || 0;
          var parent = document.body || document.documentElement;
          if (!parent) return client;
          var el = document.createElement('div');
          el.setAttribute('aria-hidden', 'true');
          el.style.cssText = 'position:fixed;inset:0;visibility:hidden;pointer-events:none;';
          parent.appendChild(el);
          var probe = Math.round(el.getBoundingClientRect().height);
          el.remove();
          return Math.max(client, probe);
        }

        function getAppHeightCSSValue() {
          if (isKeyboardOpen()) return measureBrowserAppHeight() + 'px';
          if (isIosStandaloneWebApp()) {
            var h = Math.max(measureBrowserAppHeight(), measureLayoutViewportHeight());
            if (h >= 400) return h + 'px';
            return '-webkit-fill-available';
          }
          return measureBrowserAppHeight() + 'px';
        }

        function setAppHeight() {
          document.documentElement.style.setProperty('--app-height', getAppHeightCSSValue());
          if (isIosStandaloneWebApp() && !isKeyboardOpen()) {
            document.documentElement.style.setProperty('--app-shell-keyboard-inset', '0px');
          }
        }

        // This script runs in <head> before <body>. Reading document.body.scrollTop
        // throws (QA leftover after #26/#27). Window scroller only — assigning
        // documentElement/body.scrollTop also cancels nested overflow-x fling.
        function resetWindowScroll() {
          try {
            if ((window.scrollX || 0) === 0 && (window.scrollY || 0) === 0) return;
            window.scrollTo(0, 0);
          } catch (e) {}
        }

        function scheduleSettle(delays) {
          for (var i = 0; i < delays.length; i++) {
            window.setTimeout(onViewportSettle, delays[i]);
          }
        }

        function onViewportSettle() {
          if (isKeyboardOpen()) {
            keyboardWasOpen = true;
            setAppHeight();
            return;
          }
          if (keyboardWasOpen) {
            keyboardWasOpen = false;
            scheduleSettle(KEYBOARD_CLOSE_DELAYS);
          }
          resetWindowScroll();
          setAppHeight();
        }

        function onVisualViewportResize() {
          if (isKeyboardOpen()) {
            keyboardWasOpen = true;
            setAppHeight();
            return;
          }
          if (keyboardWasOpen) {
            keyboardWasOpen = false;
            scheduleSettle(KEYBOARD_CLOSE_DELAYS);
            return;
          }
          // Height only. resetWindowScroll here snaps calendar overflow-x mid-flick.
          setAppHeight();
        }

        function onFocusOut(event) {
          var target = event.target;
          if (!target || !target.matches) return;
          if (!target.matches('input, textarea, select, [contenteditable="true"]')) return;
          scheduleSettle(KEYBOARD_CLOSE_DELAYS);
        }

        if (isIosStandaloneWebApp()) {
          // Never 100vh (screen, not webview). Fill-available is the webview
          // until the layout probe returns a pixel height.
          document.documentElement.style.setProperty('--app-height', '-webkit-fill-available');
          document.documentElement.style.setProperty('--safe-area-bottom', '34px');
          document.documentElement.style.setProperty('--app-shell-bottomnav-pad', '34px');
          document.documentElement.style.setProperty('--app-shell-keyboard-inset', '0px');
          // env() until JS measures. Do not force 0 — that is the BEA-78 frost.
          document.documentElement.style.setProperty(
            '--app-shell-status-slab',
            'env(safe-area-inset-top, 0px)'
          );
        }

        onViewportSettle();
        requestAnimationFrame(onViewportSettle);
        scheduleSettle(SETTLE_DELAYS);
        window.addEventListener('resize', onViewportSettle);
        window.addEventListener('orientationchange', onViewportSettle);
        window.addEventListener('pageshow', onViewportSettle);
        window.addEventListener('focusout', onFocusOut);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', onVisualViewportResize);
        }
      })();
    </script>
